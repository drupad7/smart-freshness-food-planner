
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Freshness Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f7f5;
            color: #222;
        }

        h1 {
            font-size: 25px;
            text-align: center;
            color: #18794e;
        }

        p {
            line-height: 1.5;
        }

        .description {
            text-align: center;
            color: #555;
        }

        .image-container {
            width: 100%;
            margin-top: 15px;
            background: #e3e8e5;
            border-radius: 12px;
            overflow: hidden;
        }

        video,
        img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        #camera,
        #capturedImage,
        #resultImage {
            margin-top: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #18794e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #retakeButton {
            background: #555;
        }

        #status {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        #loading {
            margin-top: 12px;
            padding: 14px;
            background: #e8f5ed;
            border-radius: 8px;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid #c4dfce;
            border-top-color: #18794e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .detection {
            background: white;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border-left: 4px solid #18794e;
        }

        .detection p {
            margin-bottom: 0;
        }

        .section-title {
            margin-top: 22px;
            margin-bottom: 8px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <h1>Smart Freshness Monitor</h1>

    <p class="description">
        Position your phone above the food box. Capture an image
        to identify supported food items using the cloud detection API.
    </p>

    <!-- Live camera -->
    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>

    <!-- Captured image shown while analysis is running -->
    <img
        id="capturedImage"
        alt="Captured food image awaiting analysis"
        hidden
    >

    <!-- Image containing detection boxes -->
    <img
        id="resultImage"
        alt="Food detection results with bounding boxes"
        hidden
    >

    <!-- Hidden canvas used to capture and resize images -->
    <canvas id="canvas" hidden></canvas>

    <!-- Camera controls -->
    <button id="startButton" type="button">
        Start Camera
    </button>

    <button id="captureButton" type="button" disabled>
        Capture and Analyze
    </button>

    <button id="retakeButton" type="button" hidden>
        Retake Image
    </button>

    <!-- Status and loading indicator -->
    <div id="status" role="status" aria-live="polite">
        Camera not started. Tap Start Camera to begin.
    </div>

    <div id="loading" hidden>
        <span class="spinner"></span>
        Analyzing your image. Please wait...
    </div>

    <!-- Detection results -->
    <h3 class="section-title" id="resultsTitle" hidden>
        Detection Results
    </h3>

    <div id="results"></div>

    <script>
        // Use the same deployed API that serves this webpage.
        const API_BASE_URL = window.location.origin;

        const camera = document.getElementById("camera");
        const capturedImage = document.getElementById("capturedImage");
        const resultImage = document.getElementById("resultImage");
        const canvas = document.getElementById("canvas");

        const startButton = document.getElementById("startButton");
        const captureButton = document.getElementById("captureButton");
        const retakeButton = document.getElementById("retakeButton");

        const statusBox = document.getElementById("status");
        const loading = document.getElementById("loading");
        const results = document.getElementById("results");
        const resultsTitle = document.getElementById("resultsTitle");

        let cameraStream = null;
        let capturedImageUrl = null;
        let isAnalyzing = false;

        // Start the phone's rear camera.
        startButton.addEventListener("click", async () => {
            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {
                statusBox.textContent =
                    "Camera access is unavailable. Open this page using HTTPS in a supported browser.";
                return;
            }

            try {
                startButton.disabled = true;
                statusBox.textContent = "Starting camera...";

                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }

                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" }
                    },
                    audio: false
                });

                camera.srcObject = cameraStream;
                camera.hidden = false;

                capturedImage.hidden = true;
                resultImage.hidden = true;
                retakeButton.hidden = true;
                loading.hidden = true;

                await camera.play();

                captureButton.disabled = false;

                statusBox.textContent =
                    "Camera ready. Position your phone above the food and capture an image.";

            } catch (error) {
                statusBox.textContent =
                    "Could not start camera: " + error.message +
                    ". Allow camera permission and use HTTPS.";

            } finally {
                startButton.disabled = false;
            }
        });

        // Capture an image and show it immediately.
        captureButton.addEventListener("click", async () => {
            if (isAnalyzing) {
                return;
            }

            if (!camera.videoWidth || !camera.videoHeight) {
                statusBox.textContent =
                    "Please wait for the camera to initialize.";
                return;
            }

            isAnalyzing = true;
            captureButton.disabled = true;
            startButton.disabled = true;
            retakeButton.hidden = true;

            results.replaceChildren();
            resultsTitle.hidden = true;
            resultImage.hidden = true;
            capturedImage.hidden = true;
            loading.hidden = true;

            try {
                // Resize the image to reduce upload time.
                const maxWidth = 640;
                const scale = Math.min(
                    1,
                    maxWidth / camera.videoWidth
                );

                canvas.width = Math.round(camera.videoWidth * scale);
                canvas.height = Math.round(camera.videoHeight * scale);

                const context = canvas.getContext("2d");

                context.drawImage(
                    camera,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                // Convert the captured frame into a JPEG.
                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob(
                        imageBlob => {
                            if (imageBlob) {
                                resolve(imageBlob);
                            } else {
                                reject(
                                    new Error("Could not capture image.")
                                );
                            }
                        },
                        "image/jpeg",
                        0.75
                    );
                });

                // Release the previous preview URL, if any.
                if (capturedImageUrl) {
                    URL.revokeObjectURL(capturedImageUrl);
                }

                // Show the captured photo before waiting for the API.
                capturedImageUrl = URL.createObjectURL(blob);
                capturedImage.src = capturedImageUrl;

                camera.hidden = true;
                capturedImage.hidden = false;

                statusBox.textContent =
                    "Image captured. Sending it to the cloud for analysis...";

                loading.hidden = false;

                // Upload the captured image to the deployed API.
                const formData = new FormData();
                formData.append(
                    "file",
                    blob,
                    "mobile_capture.jpg"
                );

                const response = await fetch(
                    `${API_BASE_URL}/detect-food`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Food detection failed."
                    );
                }

                loading.hidden = true;

                // Display the annotated image returned by the API.
                if (data.annotated_image) {
                    resultImage.src =
                        "data:image/jpeg;base64," +
                        data.annotated_image;

                    resultImage.hidden = false;
                    capturedImage.hidden = true;
                }

                statusBox.textContent =
                    `Analysis complete. ${data.detection_count} food object(s) detected.`;

                resultsTitle.hidden = false;

                // Display a message if no supported food was detected.
                if (!data.detections || data.detections.length === 0) {
                    results.textContent =
                        "No supported food objects were detected. Try better lighting or move the phone closer.";
                }

                // Display each detected food and confidence score.
                (data.detections || []).forEach(item => {
                    const card = document.createElement("div");
                    card.className = "detection";

                    const name = document.createElement("strong");
                    name.textContent = item.food;

                    const confidence = document.createElement("p");
                    confidence.textContent =
                        "Confidence: " +
                        (item.confidence * 100).toFixed(1) +
                        "%";

                    card.append(name, confidence);
                    results.appendChild(card);
                });

                // Explain what the detector can and cannot determine.
                const note = document.createElement("p");
                note.textContent =
                    "Note: Food object detection identifies supported food categories. It does not determine freshness or food safety.";

                results.appendChild(note);

                retakeButton.hidden = false;

            } catch (error) {
                loading.hidden = true;

                statusBox.textContent =
                    "Analysis failed: " + error.message;

                // Keep the captured image visible so the user can inspect it.
                camera.hidden = true;
                capturedImage.hidden = !capturedImageUrl;

                retakeButton.hidden = false;

            } finally {
                isAnalyzing = false;
                captureButton.disabled = false;
                startButton.disabled = false;
            }
        });

        // Return to the live camera for another capture.
        retakeButton.addEventListener("click", () => {
            capturedImage.hidden = true;
            resultImage.hidden = true;
            loading.hidden = true;
            camera.hidden = false;

            results.replaceChildren();
            resultsTitle.hidden = true;

            statusBox.textContent =
                "Camera ready. Capture another image when you are ready.";

            retakeButton.hidden = true;
        });

        // Stop the camera when leaving the webpage.
        window.addEventListener("beforeunload", () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }

            if (capturedImageUrl) {
                URL.revokeObjectURL(capturedImageUrl);
            }
        });
    </script>
</body>
</html>
